name: Android tests and launch smoke
on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Preflight release signing credentials
        shell: bash
        env:
          RELEASE_KEYSTORE_B64: ${{ secrets.PLAYLUMI_RELEASE_KEYSTORE_BASE64 }}
          RELEASE_PASSWORD: ${{ secrets.PLAYLUMI_SIGNING_PASSWORD }}
        run: |
          if [ -z "$RELEASE_KEYSTORE_B64" ] || [ -z "$RELEASE_PASSWORD" ]; then
            echo "::error::Cannot approve a Playlumi update: new signing keystore/password missing."
            echo "Restore the original v0.45 keystore via private GitHub Actions secrets before continuing."
            exit 1
          fi
          echo "New signing credentials are configured; exact certificate verification follows after building."
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Use increasing Android version code
        shell: bash
        run: echo "PLAYLUMI_BUILD_CODE=$((24000 + GITHUB_RUN_NUMBER))" >> "$GITHUB_ENV"
      - name: Test existing games and flight math, lint, compile Android
        run: gradle testDebugUnitTest lintDebug assembleDebug
  emulator-launch:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Allow Android emulator to use KVM when available
        shell: bash
        run: |
          if [ -e /dev/kvm ]; then sudo chmod 666 /dev/kvm; fi
      - name: Install and open Playlumi in an Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_5
          disable-animations: true
          script: bash tools/smoke-android.sh
      - name: Use increasing Android version code
        shell: bash
        run: echo "PLAYLUMI_BUILD_CODE=$((24000 + GITHUB_RUN_NUMBER))" >> "$GITHUB_ENV"
      - name: Build unsigned release for local private signing
        run: gradle assembleRelease
      - name: Save verified unsigned APK for private signing
        uses: actions/upload-artifact@v4
        with:
          name: playlumi-unsigned-release-apk
          path: app/build/outputs/apk/release/*-unsigned.apk
          if-no-files-found: error
          retention-days: 7
      - name: Sign release with permanently backed-up new Playlumi certificate
        id: sign_release
        shell: bash
        env:
          RELEASE_KEYSTORE_B64: ${{ secrets.PLAYLUMI_RELEASE_KEYSTORE_BASE64 }}
          RELEASE_PASSWORD: ${{ secrets.PLAYLUMI_SIGNING_PASSWORD }}
          EXPECTED_CERT_SHA256: 09:99:D6:3A:1A:A1:D8:04:18:E0:B4:FA:1E:A0:15:13:3A:DD:F7:3B:50:75:76:61:71:A9:A6:73:3D:14:AA:85
        run: |
          set -euo pipefail
          if [ -z "$RELEASE_KEYSTORE_B64" ] && [ -z "$RELEASE_PASSWORD" ]; then
            echo "::error::Release BLOCKED: new release signing secrets are missing. No installable update can be approved."
            echo "Configure PLAYLUMI_RELEASE_KEYSTORE_BASE64 and PLAYLUMI_SIGNING_PASSWORD privately; use the backed-up new keystore."
            exit 1
          fi
          if [ -z "$RELEASE_KEYSTORE_B64" ] || [ -z "$RELEASE_PASSWORD" ]; then
            echo "::error::Release signing secrets incomplete. No APK will be published."
            exit 1
          fi
          STORE_PATH="$RUNNER_TEMP/playlumi-original-release.p12"
          trap 'rm -f "$STORE_PATH"' EXIT
          printf '%s' "$RELEASE_KEYSTORE_B64" | base64 --decode > "$STORE_PATH"
          chmod 600 "$STORE_PATH"
          PLAYLUMI_STORE_FILE="$STORE_PATH" PLAYLUMI_SIGNING_PASSWORD="$RELEASE_PASSWORD" gradle --no-daemon assembleRelease --rerun-tasks
          APK="app/build/outputs/apk/release/app-release.apk"
          test -s "$APK"
          APK_SIGNER="$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -n 1)"
          test -n "$APK_SIGNER"
          VERIFY_OUTPUT="$("$APK_SIGNER" verify --min-sdk-version 23 --verbose --print-certs "$APK")"
          printf '%s\n' "$VERIFY_OUTPUT"
          printf '%s\n' "$VERIFY_OUTPUT" | grep -Fq 'Verified using v1 scheme (JAR signing): true'
          printf '%s\n' "$VERIFY_OUTPUT" | grep -Fq 'Verified using v2 scheme (APK Signature Scheme v2): true'
          ACTUAL="$(printf '%s\n' "$VERIFY_OUTPUT" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p' | head -n 1 | tr -d ' :\r\n' | tr '[:upper:]' '[:lower:]')"
          AAPT="$(find "$ANDROID_HOME/build-tools" -name aapt -type f | sort -V | tail -n 1)"
          test -n "$AAPT"
          PACKAGE_LINE="$("$AAPT" dump badging "$APK" | head -n 1)"
          if [[ "$PACKAGE_LINE" != *"name='nl.playlumi.app'"* ]]; then
            echo "::error::Unexpected Android package name."
            exit 1
          fi
          VERSION_CODE="$(printf '%s\n' "$PACKAGE_LINE" | sed -n "s/.*versionCode='\([0-9][0-9]*\)'.*/\1/p")"
          if [ -z "$VERSION_CODE" ] || [ "$VERSION_CODE" -le 24302 ]; then
            echo "::error::Release update versionCode must exceed original v0.45 (24302)."
            exit 1
          fi
          EXPECTED="$(printf '%s' "$EXPECTED_CERT_SHA256" | tr -d ' :\r\n' | tr '[:upper:]' '[:lower:]')"
          if [ -z "$ACTUAL" ] || [ "$ACTUAL" != "$EXPECTED" ]; then
            echo "::error::APK signature does not match the new verified release certificate."
            rm -f "$APK"
            exit 1
          fi
          echo "signed=true" >> "$GITHUB_OUTPUT"
          echo "Release APK signed with the verified new certificate."
      - name: Publish verified new-key signed APK
        if: steps.sign_release.outputs.signed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: playlumi-newkey-signed-release
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 14
      - name: Clarify what was NOT tested
        if: always()
        run: |
          echo "## Playlumi app release gate" >> "$GITHUB_STEP_SUMMARY"
          echo "The workflow gates the unsigned release artifact on emulator startup without an immediate crash; still requires device acceptance." >> "$GITHUB_STEP_SUMMARY"
          echo "The workflow FAILS CLOSED unless new release signing succeeds. Only the newkey-signed verified APK may be shared as an update." >> "$GITHUB_STEP_SUMMARY"
          echo "Real Samsung update and saved-data acceptance remain separate from emulator smoke testing." >> "$GITHUB_STEP_SUMMARY"
