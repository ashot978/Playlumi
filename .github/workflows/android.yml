name: Android Playlumi 0.87.0 fast build
on:
  push:
  workflow_dispatch:
    inputs:
      full_qa:
        description: 'Also run all unit tests and Android Lint after APK upload'
        type: boolean
        default: false

concurrency:
  group: playlumi-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
          cache-read-only: false
      - name: Pin release versionCode
        run: echo "PLAYLUMI_BUILD_CODE=600870" >> "$GITHUB_ENV"
      - name: Compile production APK
        run: gradle --no-daemon assembleRelease

      - name: Verify approved village and four illustrated game worlds in APK
        shell: bash
        run: |
          set -euo pipefail
          ART_HASH=bc39c748fb82a101e0280d16d6d3de1cd3e44d39453f87bb6d30870e155f5804
          for APK in app/build/outputs/apk/release/app-release-unsigned.apk; do
            test -s "$APK"
            actual=$(unzip -p "$APK" assets/playlumi_village.webp | sha256sum | awk '{print $1}')
            if [[ "$actual" != "$ART_HASH" ]]; then
              echo "Wrong/missing actual village art in $APK: $actual" >&2
              exit 1
            fi
            for line in \
              "colors.webp:0f4e75126f1837234049742116f76bec0b800a67a98647661c9d42c8c098351e" \
              "letters.webp:45beccb5df3be63c21965e04c31b43d24d71a378b42a20f40a70b719284d2484" \
              "memory.webp:f3b8b045a44c75e1bac2d76a2ae886b5d02642ebfa2376f5a7a50b7eee8d61df" \
              "music.webp:9ccf7ef1ec5d705c88f350a5f84bab3610a200d3ac3d802f5788219fec99df78"; do
              IFS=: read -r asset expected <<< "$line"
              actual=$(unzip -p "$APK" "assets/magic/$asset" | sha256sum | awk '{print $1}')
              [[ "$actual" == "$expected" ]] || { echo "Missing/wrong approved art: $asset" >&2; exit 1; }
              echo "PASS: approved game art $asset $actual"
            done
            "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | grep -F "package: name='nl.playlumi.app'"
            "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | grep -F "versionCode='600870'"
            "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | grep -F "versionName='0.87.0'"
          done
          sha256sum app/build/outputs/apk/release/app-release-unsigned.apk > build-release-unsigned-sha256.txt

      - name: Copy Android SDK signing utilities for private offline release
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/signing-tools/lib
          SDK_TOOLS="$ANDROID_HOME/build-tools/35.0.0"
          cp "$SDK_TOOLS/apksigner" build/signing-tools/apksigner
          cp "$SDK_TOOLS/lib/apksigner.jar" build/signing-tools/lib/apksigner.jar
          cp "$SDK_TOOLS/zipalign" build/signing-tools/zipalign
          chmod +x build/signing-tools/apksigner build/signing-tools/zipalign
          (cd build/signing-tools && sha256sum apksigner lib/apksigner.jar zipalign > tool-checksums.txt)

      - name: Upload unsigned production release for offline signing only
        uses: actions/upload-artifact@v4
        with:
          name: playlumi-087-unsigned-release
          path: |
            app/build/outputs/apk/release/app-release-unsigned.apk
            build-release-unsigned-sha256.txt
          if-no-files-found: error
          retention-days: 30

      - name: Upload standard Android SDK signing utilities
        uses: actions/upload-artifact@v4
        with:
          name: playlumi-087-offline-signing-tools
          path: build/signing-tools/
          if-no-files-found: error
          retention-days: 30

      # Sign automatically only if the owner's existing encrypted secrets are present.
      # Never publish a differently signed APK or include the key in any artifact.
      - name: Sign with existing Playlumi release certificate
        id: sign
        shell: bash
        env:
          PLAYLUMI_KEYSTORE_BASE64: ${{ secrets.PLAYLUMI_KEYSTORE_BASE64 }}
          PLAYLUMI_SIGNING_PASSWORD: ${{ secrets.PLAYLUMI_SIGNING_PASSWORD }}
        run: |
          set -euo pipefail
          if [[ -z "$PLAYLUMI_KEYSTORE_BASE64" || -z "$PLAYLUMI_SIGNING_PASSWORD" ]]; then
            echo "signed=false" >> "$GITHUB_OUTPUT"
            echo "Release key unavailable in Actions; use private offline signing."
            exit 0
          fi
          umask 077
          TMP=$(mktemp -d)
          trap 'rm -rf "$TMP"' EXIT
          printf '%s' "$PLAYLUMI_KEYSTORE_BASE64" | base64 --decode > "$TMP/release.p12"
          SDK="$ANDROID_HOME/build-tools/35.0.0"
          "$SDK/zipalign" -P 16 -f 4 app/build/outputs/apk/release/app-release-unsigned.apk "$TMP/aligned.apk"
          mkdir -p build/release
          "$SDK/apksigner" sign --ks "$TMP/release.p12" --ks-type PKCS12 --ks-key-alias playlumi-release --ks-pass env:PLAYLUMI_SIGNING_PASSWORD --key-pass env:PLAYLUMI_SIGNING_PASSWORD --v4-signing-enabled false --out build/release/Playlumi-0.87.0-release.apk "$TMP/aligned.apk"
          "$SDK/zipalign" -c -P 16 4 build/release/Playlumi-0.87.0-release.apk
          "$SDK/apksigner" verify --verbose --print-certs build/release/Playlumi-0.87.0-release.apk | tee "$TMP/certificate.txt"
          grep -Fx 'Signer #1 certificate SHA-256 digest: d2b74f018bf6111382f901c2acdc03e787811ce207d6c4435fcca9559ae9b0ef' "$TMP/certificate.txt"
          sha256sum build/release/Playlumi-0.87.0-release.apk > build/release/SHA256SUMS.txt
          echo "signed=true" >> "$GITHUB_OUTPUT"

      - name: Upload signed Playlumi APK
        if: steps.sign.outputs.signed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: playlumi-087-signed-release
          path: build/release/
          if-no-files-found: error
          retention-days: 30

      - name: Optional full quality checks
        if: github.event_name == 'workflow_dispatch' && inputs.full_qa
        run: gradle --no-daemon testDebugUnitTest lintDebug
