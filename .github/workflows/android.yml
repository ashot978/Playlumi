name: Android
on: [push, pull_request, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Prepare automatically increasing Android version code
        shell: bash
        run: echo "PLAYLUMI_BUILD_CODE=$((500000 + GITHUB_RUN_NUMBER))" >> "$GITHUB_ENV"

      - name: Test all games, lint and compile both APK variants
        run: gradle --no-daemon testDebugUnitTest lintDebug assembleDebug assembleRelease

      - name: Verify installable debug APK
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | tee apk-badging.txt
          grep -F "package: name='nl.playlumi.app'" apk-badging.txt
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$APK"
          sha256sum "$APK" | tee apk-sha256.txt

      - name: Upload installable debug APK
        uses: actions/upload-artifact@v4
        with:
          name: playlumi-debug-installable-apk
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            apk-badging.txt
            apk-sha256.txt
          if-no-files-found: error
          retention-days: 30

      - name: Upload unsigned release for offline private-key signing
        uses: actions/upload-artifact@v4
        with:
          name: playlumi-unsigned-release-apk
          path: app/build/outputs/apk/release/*-unsigned.apk
          if-no-files-found: error
          retention-days: 30
