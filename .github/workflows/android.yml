name: Android tests and launch smoke
on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Use increasing Android version code
        shell: bash
        run: echo "PLAYLUMI_BUILD_CODE=$((16000 + GITHUB_RUN_NUMBER))" >> "$GITHUB_ENV"
      - name: Test existing games and flight math, lint, compile Android
        run: gradle testDebugUnitTest lintDebug assembleDebug
  emulator-launch:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Allow Android emulator to use KVM when available
        shell: bash
        run: |
          if [ -e /dev/kvm ]; then sudo chmod 666 /dev/kvm; fi
      - name: Install and open Playlumi in an Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_5
          disable-animations: true
          script: bash tools/smoke-android.sh
      - name: Use increasing Android version code
        shell: bash
        run: echo "PLAYLUMI_BUILD_CODE=$((16000 + GITHUB_RUN_NUMBER))" >> "$GITHUB_ENV"
      - name: Build unsigned release for local private signing
        run: gradle assembleRelease
      - name: Save verified unsigned APK for private signing
        uses: actions/upload-artifact@v4
        with:
          name: playlumi-unsigned-release-apk
          path: app/build/outputs/apk/release/*-unsigned.apk
          if-no-files-found: error
          retention-days: 7
      - name: Clarify what was NOT tested
        if: always()
        run: |
          echo "## Playlumi app release gate" >> "$GITHUB_STEP_SUMMARY"
          echo "The workflow gates the unsigned release artifact on emulator startup without an immediate crash; still requires device acceptance." >> "$GITHUB_STEP_SUMMARY"
          echo "Unsigned APK artifact must be privately signed. Full gameplay and Samsung update tests are still required for stable release." >> "$GITHUB_STEP_SUMMARY"
