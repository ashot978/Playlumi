name: Android
on: [push, pull_request, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Prepare automatically increasing Android version code
        shell: bash
        run: echo "PLAYLUMI_BUILD_CODE=$((10000 + GITHUB_RUN_NUMBER))" >> "$GITHUB_ENV"

      - name: Test all games, lint and compile both APK variants
        run: gradle testDebugUnitTest lintDebug assembleDebug assembleRelease

      - name: Upload unsigned release for offline private-key signing
        uses: actions/upload-artifact@v4
        with:
          name: playlumi-unsigned-release-apk
          path: app/build/outputs/apk/release/*-unsigned.apk
          if-no-files-found: error
          retention-days: 30

