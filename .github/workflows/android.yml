name: Android tests and launch smoke
on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Use increasing Android version code
        shell: bash
        run: echo "PLAYLUMI_BUILD_CODE=24456" >> "$GITHUB_ENV"
      - name: Test existing games and flight math, lint, compile Android
        run: gradle testDebugUnitTest lintDebug assembleDebug
  emulator-launch:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Allow Android emulator to use KVM when available
        shell: bash
        run: |
          if [ -e /dev/kvm ]; then sudo chmod 666 /dev/kvm; fi
      - name: Install and open Playlumi in an Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_5
          disable-animations: true
          script: bash tools/smoke-android.sh
      - name: Publish first-launch emulator screenshot for visual review
        uses: actions/upload-artifact@v4
        with:
          name: playlumi-first-launch-visual-review
          path: |
            app/build/reports/playlumi-visual/first-launch.png
            app/build/reports/playlumi-visual/home.png
          if-no-files-found: error
          retention-days: 7
      - name: Use increasing Android version code
        shell: bash
        run: echo "PLAYLUMI_BUILD_CODE=24456" >> "$GITHUB_ENV"
      - name: Build unsigned release for local private signing
        run: gradle assembleRelease
      - name: Check release APK ZIP alignment before any signing
        shell: bash
        run: |
          set -euo pipefail
          ZIPALIGN="$(find "$ANDROID_HOME/build-tools" -name zipalign -type f | sort -V | tail -n 1)"
          test -x "$ZIPALIGN"
          APK="app/build/outputs/apk/release/app-release-unsigned.apk"
          test -s "$APK"
          "$ZIPALIGN" -c -v 4 "$APK"
      - name: Save verified unsigned APK for private signing
        uses: actions/upload-artifact@v4
        with:
          name: playlumi-unsigned-release-apk
          path: app/build/outputs/apk/release/*-unsigned.apk
          if-no-files-found: error
          retention-days: 7
      # Pull requests prove code quality; only explicit release runs attempt signing.
      # A release run still fails closed if original credentials are absent.
      - name: Verify original-signed APK against the actual CI-built release
        if: hashFiles('release-candidates/playlumi-0.63.0-original-signed.apk') != ''
        shell: bash
        run: |
          set -euo pipefail
          SIGNED="release-candidates/playlumi-0.63.0-original-signed.apk"
          UNSIGNED="app/build/outputs/apk/release/app-release-unsigned.apk"
          test -s "$SIGNED"
          test -s "$UNSIGNED"
          export SIGNED UNSIGNED
          python3 - <<'PY'
          import os,zipfile
          with zipfile.ZipFile(os.environ['SIGNED']) as signed, zipfile.ZipFile(os.environ['UNSIGNED']) as unsigned:
              assert signed.testzip() is None, 'Signed APK ZIP CRC failed'
              assert unsigned.testzip() is None, 'Unsigned APK ZIP CRC failed'
              original={i.filename:unsigned.read(i) for i in unsigned.infolist()}
              candidate={i.filename:signed.read(i) for i in signed.infolist()}
              for name,body in original.items():
                  assert candidate.get(name)==body, 'Signed APK differs from CI-built sources at '+name
              assert any(k.startswith('META-INF/') for k in candidate), 'Missing original signer manifest'
              print('PASS: every unsigned app payload matches the independently original-signed APK')
          PY
          ZIPALIGN="$(find "$ANDROID_HOME/build-tools" -name zipalign -type f | sort -V | tail -n 1)"
          APK_SIGNER="$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -n 1)"
          AAPT="$(find "$ANDROID_HOME/build-tools" -name aapt -type f | sort -V | tail -n 1)"
          test -x "$ZIPALIGN" && test -x "$APK_SIGNER" && test -x "$AAPT"
          "$ZIPALIGN" -c -v 4 "$SIGNED"
          VERIFY_OUTPUT="$("$APK_SIGNER" verify --min-sdk-version 23 --verbose --print-certs "$SIGNED")"
          printf '%s\n' "$VERIFY_OUTPUT"
          printf '%s\n' "$VERIFY_OUTPUT" | grep -Fq 'Verified using v1 scheme (JAR signing): true'
          printf '%s\n' "$VERIFY_OUTPUT" | grep -Fq 'Verified using v2 scheme (APK Signature Scheme v2): true'
          ACTUAL="$(printf '%s\n' "$VERIFY_OUTPUT" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p' | head -n 1 | tr -d ' :\r\n' | tr '[:upper:]' '[:lower:]')"
          EXPECTED="d2b74f018bf6111382f901c2acdc03e787811ce207d6c4435fcca9559ae9b0ef"
          test "$ACTUAL" = "$EXPECTED"
          PACKAGE="$("$AAPT" dump badging "$SIGNED" | head -n 1)"
          [[ "$PACKAGE" == *"name='nl.playlumi.app'"* ]]
          [[ "$PACKAGE" == *"versionCode='24456'"* ]]
          [[ "$PACKAGE" == *"versionName='0.63.0'"* ]]
          echo "PASS: original release fingerprint, v1/v2, zipalign, exact version and package"
      - name: Install the actual original-signed APK in Android emulator
        if: hashFiles('release-candidates/playlumi-0.63.0-original-signed.apk') != ''
        shell: bash
        run: |
          set -euo pipefail
          adb uninstall nl.playlumi.app
          adb install release-candidates/playlumi-0.63.0-original-signed.apk
          adb logcat -c
          adb shell am start -W -n nl.playlumi.app/.MainActivity
          sleep 5
          test -n "$(adb shell pidof nl.playlumi.app | tr -d '\r')"
          if adb logcat -d -v brief | grep -F "Process: nl.playlumi.app"; then
            echo "::error::Original-signed APK crashed after install."
            exit 1
          fi
          echo "PASS: exact original-signed APK installed and launched on API 35 emulator"
      - name: Publish emulator-approved original-signed release update
        if: hashFiles('release-candidates/playlumi-0.63.0-original-signed.apk') != ''
        uses: actions/upload-artifact@v4
        with:
          name: playlumi-original-signed-release-update
          path: release-candidates/playlumi-0.63.0-original-signed.apk
          if-no-files-found: error
          retention-days: 14
      - name: Sign release only with the original verified Playlumi certificate
        if: github.event_name == 'workflow_dispatch' && hashFiles('release-candidates/playlumi-0.63.0-original-signed.apk') == ''
        id: sign_release
        shell: bash
        env:
          RELEASE_KEYSTORE_B64: ${{ secrets.PLAYLUMI_RELEASE_KEYSTORE_BASE64 }}
          RELEASE_PASSWORD: ${{ secrets.PLAYLUMI_SIGNING_PASSWORD }}
          EXPECTED_CERT_SHA256: D2:B7:4F:01:8B:F6:11:13:82:F9:01:C2:AC:DC:03:E7:87:81:1C:E2:07:D6:C4:43:5F:CC:A9:55:9A:E9:B0:EF
        run: |
          set -euo pipefail
          if [ -z "$RELEASE_KEYSTORE_B64" ] && [ -z "$RELEASE_PASSWORD" ]; then
            echo "::error::Release BLOCKED: original v0.45 signing secrets are missing. No installable update can be approved."
            echo "Configure PLAYLUMI_RELEASE_KEYSTORE_BASE64 and PLAYLUMI_SIGNING_PASSWORD privately; do not create a new signing key."
            exit 1
          fi
          if [ -z "$RELEASE_KEYSTORE_B64" ] || [ -z "$RELEASE_PASSWORD" ]; then
            echo "::error::Release signing secrets incomplete. No APK will be published."
            exit 1
          fi
          STORE_PATH="$RUNNER_TEMP/playlumi-original-release.p12"
          trap 'rm -f "$STORE_PATH"' EXIT
          printf '%s' "$RELEASE_KEYSTORE_B64" | base64 --decode > "$STORE_PATH"
          chmod 600 "$STORE_PATH"
          PLAYLUMI_STORE_FILE="$STORE_PATH" PLAYLUMI_SIGNING_PASSWORD="$RELEASE_PASSWORD" gradle --no-daemon assembleRelease --rerun-tasks
          APK="app/build/outputs/apk/release/app-release.apk"
          test -s "$APK"
          APK_SIGNER="$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -n 1)"
          test -n "$APK_SIGNER"
          ZIPALIGN="$(find "$ANDROID_HOME/build-tools" -name zipalign -type f | sort -V | tail -n 1)"
          test -x "$ZIPALIGN"
          "$ZIPALIGN" -c -v 4 "$APK"
          VERIFY_OUTPUT="$("$APK_SIGNER" verify --min-sdk-version 23 --verbose --print-certs "$APK")"
          printf '%s\n' "$VERIFY_OUTPUT"
          printf '%s\n' "$VERIFY_OUTPUT" | grep -Fq 'Verified using v1 scheme (JAR signing): true'
          printf '%s\n' "$VERIFY_OUTPUT" | grep -Fq 'Verified using v2 scheme (APK Signature Scheme v2): true'
          ACTUAL="$(printf '%s\n' "$VERIFY_OUTPUT" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p' | head -n 1 | tr -d ' :\r\n' | tr '[:upper:]' '[:lower:]')"
          AAPT="$(find "$ANDROID_HOME/build-tools" -name aapt -type f | sort -V | tail -n 1)"
          test -n "$AAPT"
          PACKAGE_LINE="$("$AAPT" dump badging "$APK" | head -n 1)"
          if [[ "$PACKAGE_LINE" != *"name='nl.playlumi.app'"* ]]; then
            echo "::error::Unexpected Android package name."
            exit 1
          fi
          VERSION_CODE="$(printf '%s\n' "$PACKAGE_LINE" | sed -n "s/.*versionCode='\([0-9][0-9]*\)'.*/\1/p")"
          if [ -z "$VERSION_CODE" ] || [ "$VERSION_CODE" -le 24302 ]; then
            echo "::error::Release update versionCode must exceed original v0.45 (24302)."
            exit 1
          fi
          EXPECTED="$(printf '%s' "$EXPECTED_CERT_SHA256" | tr -d ' :\r\n' | tr '[:upper:]' '[:lower:]')"
          if [ -z "$ACTUAL" ] || [ "$ACTUAL" != "$EXPECTED" ]; then
            echo "::error::APK signature does not match the original verified certificate."
            rm -f "$APK"
            exit 1
          fi
          echo "signed=true" >> "$GITHUB_OUTPUT"
          echo "Release APK signed with the verified original certificate."
      - name: Publish verified original-signed update APK
        if: github.event_name == 'workflow_dispatch' && hashFiles('release-candidates/playlumi-0.63.0-original-signed.apk') == '' && steps.sign_release.outputs.signed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: playlumi-original-signed-release-update
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 14
      - name: Clarify what was NOT tested
        if: always()
        run: |
          echo "## Playlumi app release gate" >> "$GITHUB_STEP_SUMMARY"
          echo "The workflow gates the unsigned release artifact on emulator startup without an immediate crash; still requires device acceptance." >> "$GITHUB_STEP_SUMMARY"
          echo "Pull requests and pushes validate tests, lint, emulator, screenshot and unsigned release but are NOT signed releases." >> "$GITHUB_STEP_SUMMARY"
          echo "Explicit workflow_dispatch release runs FAIL CLOSED unless original signing succeeds. Only the original-signed verified APK may be shared as an update." >> "$GITHUB_STEP_SUMMARY"
          echo "Real Samsung update and saved-data acceptance remain separate from emulator smoke testing." >> "$GITHUB_STEP_SUMMARY"
