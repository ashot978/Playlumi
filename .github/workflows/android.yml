name: Android Playlumi 0.84 UI acceptance
on: [push, pull_request, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        mode: [phone, fold]
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Pin release versionCode
        run: echo "PLAYLUMI_BUILD_CODE=600840" >> "$GITHUB_ENV"
      - name: Test, lint and build both APK variants
        run: gradle --no-daemon testDebugUnitTest lintDebug assembleDebug assembleRelease

      - name: Verify approved village and four illustrated game worlds in APK
        shell: bash
        run: |
          set -euo pipefail
          ART_HASH=bc39c748fb82a101e0280d16d6d3de1cd3e44d39453f87bb6d30870e155f5804
          for APK in app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/release/app-release-unsigned.apk; do
            test -s "$APK"
            actual=$(unzip -p "$APK" assets/playlumi_village.webp | sha256sum | awk '{print $1}')
            if [[ "$actual" != "$ART_HASH" ]]; then
              echo "Wrong/missing actual village art in $APK: $actual" >&2
              exit 1
            fi
            for line in \
              "colors.webp:0f4e75126f1837234049742116f76bec0b800a67a98647661c9d42c8c098351e" \
              "letters.webp:45beccb5df3be63c21965e04c31b43d24d71a378b42a20f40a70b719284d2484" \
              "memory.webp:f3b8b045a44c75e1bac2d76a2ae886b5d02642ebfa2376f5a7a50b7eee8d61df" \
              "music.webp:9ccf7ef1ec5d705c88f350a5f84bab3610a200d3ac3d802f5788219fec99df78"; do
              IFS=: read -r asset expected <<< "$line"
              actual=$(unzip -p "$APK" "assets/magic/$asset" | sha256sum | awk '{print $1}')
              [[ "$actual" == "$expected" ]] || { echo "Missing/wrong approved art: $asset" >&2; exit 1; }
              echo "PASS: approved game art $asset $actual"
            done
            "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | grep -F "package: name='nl.playlumi.app'"
            "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | grep -F "versionCode='600840'"
            "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | grep -F "versionName='0.84.0'"
          done
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose app/build/outputs/apk/debug/app-debug.apk
          sha256sum app/build/outputs/apk/debug/app-debug.apk > build-debug-sha256.txt
          sha256sum app/build/outputs/apk/release/app-release-unsigned.apk > build-release-unsigned-sha256.txt

      - name: Copy Android SDK signing utilities for private offline release
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/signing-tools/lib
          SDK_TOOLS="$ANDROID_HOME/build-tools/35.0.0"
          cp "$SDK_TOOLS/apksigner" build/signing-tools/apksigner
          cp "$SDK_TOOLS/lib/apksigner.jar" build/signing-tools/lib/apksigner.jar
          cp "$SDK_TOOLS/zipalign" build/signing-tools/zipalign
          chmod +x build/signing-tools/apksigner build/signing-tools/zipalign
          (cd build/signing-tools && sha256sum apksigner lib/apksigner.jar zipalign > tool-checksums.txt)

      - name: Enable KVM acceleration for Android emulator
        shell: bash
        run: |
          if [[ -e /dev/kvm ]]; then
            echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
            sudo udevadm control --reload-rules
            sudo udevadm trigger --name-match=kvm
          fi
          if [[ ! -r /dev/kvm || ! -w /dev/kvm ]]; then
            echo "ANDROID_I_WANT_MY_TCG=yes" >> "$GITHUB_ENV"
            echo "WARNING: no KVM; enabling Android emulator software fallback"
          else
            echo "KVM hardware acceleration available"
          fi

      - name: Emulator game and screenshot regression
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: default
          arch: x86_64
          profile: pixel_7
          disable-animations: true
          emulator-boot-timeout: 600
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          disable-linux-hw-accel: auto
          script: bash ci/smoke-village.sh ${{ matrix.mode }}

      - name: Upload emulator QA screenshots
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playlumi-084-screen-qa-${{ matrix.mode }}
          path: build/qa/screenshots/
          if-no-files-found: warn
          retention-days: 30

      - name: Upload validated debug APK
        if: matrix.mode == 'phone'
        uses: actions/upload-artifact@v4
        with:
          name: playlumi-084-debug-apk
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            build-debug-sha256.txt
          if-no-files-found: error
          retention-days: 30

      - name: Upload unsigned production release for offline signing only
        if: matrix.mode == 'phone'
        uses: actions/upload-artifact@v4
        with:
          name: playlumi-084-unsigned-release
          path: |
            app/build/outputs/apk/release/app-release-unsigned.apk
            build-release-unsigned-sha256.txt
          if-no-files-found: error
          retention-days: 30

      - name: Upload standard Android SDK signing utilities
        if: matrix.mode == 'phone'
        uses: actions/upload-artifact@v4
        with:
          name: playlumi-084-offline-signing-tools
          path: build/signing-tools/
          if-no-files-found: error
          retention-days: 30
