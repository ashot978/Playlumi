name: Android Playlumi 0.110 release candidate
on:
  push:
  workflow_dispatch:

concurrency:
  group: playlumi-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Mandatory offline curriculum and state regression checks
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/rc-check
          javac -encoding UTF-8 -d build/rc-check -sourcepath app/src/main/java tools/qa/ReleaseCandidateCheck.java tools/qa/ThinkingPracticeCheck.java tools/qa/PlayIdeasCheck.java tools/qa/FoundationsCheck.java tools/qa/DrawingHistoryCheck.java app/src/main/java/nl/playlumi/app/PlaylumiPlayIdeas.java app/src/main/java/nl/playlumi/app/PlaylumiPlayOverview.java
          timeout 90s java -cp build/rc-check nl.playlumi.app.ReleaseCandidateCheck | tee build/rc-check/report.txt
          timeout 90s java -cp build/rc-check nl.playlumi.app.ThinkingPracticeCheck | tee -a build/rc-check/report.txt
          timeout 90s java -cp build/rc-check nl.playlumi.app.PlayIdeasCheck | tee -a build/rc-check/report.txt
          timeout 90s java -cp build/rc-check nl.playlumi.app.FoundationsCheck | tee -a build/rc-check/report.txt
          timeout 90s java -cp build/rc-check nl.playlumi.app.DrawingHistoryCheck | tee -a build/rc-check/report.txt
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
          cache-read-only: false
      - name: Pin release versionCode
        run: echo "PLAYLUMI_BUILD_CODE=601011" >> "$GITHUB_ENV"
      - name: Compile debug and production APKs
        run: gradle --no-daemon assembleDebug assembleRelease

      - name: Verify approved village and four illustrated game worlds in APK
        shell: bash
        run: |
          set -euo pipefail
          ART_HASH=bc39c748fb82a101e0280d16d6d3de1cd3e44d39453f87bb6d30870e155f5804
          for APK in app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/release/app-release-unsigned.apk; do
            test -s "$APK"
            actual=$(unzip -p "$APK" assets/playlumi_village.webp | sha256sum | awk '{print $1}')
            if [[ "$actual" != "$ART_HASH" ]]; then
              echo "Wrong/missing actual village art in $APK: $actual" >&2
              exit 1
            fi
            for line in \
              "colors.webp:0f4e75126f1837234049742116f76bec0b800a67a98647661c9d42c8c098351e" \
              "letters.webp:45beccb5df3be63c21965e04c31b43d24d71a378b42a20f40a70b719284d2484" \
              "memory.webp:f3b8b045a44c75e1bac2d76a2ae886b5d02642ebfa2376f5a7a50b7eee8d61df" \
              "music.webp:9ccf7ef1ec5d705c88f350a5f84bab3610a200d3ac3d802f5788219fec99df78"; do
              IFS=: read -r asset expected <<< "$line"
              actual=$(unzip -p "$APK" "assets/magic/$asset" | sha256sum | awk '{print $1}')
              [[ "$actual" == "$expected" ]] || { echo "Missing/wrong approved art: $asset" >&2; exit 1; }
              echo "PASS: approved game art $asset $actual"
            done
            "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | grep -F "package: name='nl.playlumi.app'"
            "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | grep -F "versionCode='601011'"
            "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | grep -F "versionName='0.110'"
          done
          sha256sum app/build/outputs/apk/release/app-release-unsigned.apk > build-release-unsigned-sha256.txt

      - name: Mandatory full unit tests and Android Lint
        run: gradle --no-daemon testDebugUnitTest lintDebug

      - name: Copy Android SDK signing utilities for private offline release
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/signing-tools/lib
          SDK_TOOLS="$ANDROID_HOME/build-tools/35.0.0"
          cp "$SDK_TOOLS/apksigner" build/signing-tools/apksigner
          cp "$SDK_TOOLS/lib/apksigner.jar" build/signing-tools/lib/apksigner.jar
          cp "$SDK_TOOLS/zipalign" build/signing-tools/zipalign
          chmod +x build/signing-tools/apksigner build/signing-tools/zipalign
          (cd build/signing-tools && sha256sum apksigner lib/apksigner.jar zipalign > tool-checksums.txt)

      - name: Upload unsigned production release for offline signing only
        uses: actions/upload-artifact@v4
        with:
          name: playlumi-0110-unsigned-release
          path: |
            app/build/outputs/apk/release/app-release-unsigned.apk
            build-release-unsigned-sha256.txt
            build/rc-check/report.txt
          if-no-files-found: error
          retention-days: 30

      - name: Upload standard Android SDK signing utilities
        uses: actions/upload-artifact@v4
        with:
          name: playlumi-0110-offline-signing-tools
          path: build/signing-tools/
          if-no-files-found: error
          retention-days: 30

      # Signing is performed privately after these gates. The original release
      # key and password never enter GitHub, CI logs, or uploaded artifacts.
      - name: Upload full QA reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playlumi-0110-full-qa
          path: |
            app/build/reports/tests/
            app/build/reports/lint-results-debug.*
            app/build/test-results/
            build/rc-check/report.txt
          if-no-files-found: ignore
          retention-days: 30
