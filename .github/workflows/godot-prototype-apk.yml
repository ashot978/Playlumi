name: Godot APK prototype
on:
  push:
    branches: [feature/godot-starcatch-apk-build-20261124]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  export-android:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android packages
        run: sdkmanager --install "platform-tools" "platforms;android-35" "build-tools;35.0.0"
      - name: Download Godot 4.3 and export templates
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 3 -o /tmp/godot.zip https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_linux.x86_64.zip
          unzip -q /tmp/godot.zip -d /tmp
          chmod +x /tmp/Godot_v4.3-stable_linux.x86_64
          curl -fL --retry 3 -o /tmp/templates.tpz https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_export_templates.tpz
          mkdir -p "$HOME/.local/share/godot/export_templates/4.3.stable"
          unzip -q /tmp/templates.tpz -d /tmp/godot-templates
          cp -a /tmp/godot-templates/templates/. "$HOME/.local/share/godot/export_templates/4.3.stable/"
      - name: Configure Godot Android export paths
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.config/godot"
          /tmp/Godot_v4.3-stable_linux.x86_64 --headless --path godot --editor --quit
          settings="$HOME/.config/godot/editor_settings-4.tres"
          test -f "$settings"
          sed -i "/^\[resource\]/a export/android/android_sdk_path = \"$ANDROID_HOME\"\nexport/android/java_sdk_path = \"$JAVA_HOME\"" "$settings"
      - name: Export prototype debug APK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build
          /tmp/Godot_v4.3-stable_linux.x86_64 --headless --path godot --editor --quit
          /tmp/Godot_v4.3-stable_linux.x86_64 --headless --path godot --export-debug "Android" "$GITHUB_WORKSPACE/build/Playlumi-Godot-prototype-debug.apk"
          test -s build/Playlumi-Godot-prototype-debug.apk
      - name: Check APK package and signature
        shell: bash
        run: |
          set -euo pipefail
          APK=build/Playlumi-Godot-prototype-debug.apk
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | tee build/apk-badging.txt
          grep -F "package: name='nl.playlumi.prototype'" build/apk-badging.txt
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$APK"
          sha256sum "$APK" | tee build/apk-sha256.txt
      - name: Upload installable debug APK
        uses: actions/upload-artifact@v4
        with:
          name: Playlumi-Godot-prototype-debug-apk
          path: |
            build/Playlumi-Godot-prototype-debug.apk
            build/apk-badging.txt
            build/apk-sha256.txt
          if-no-files-found: error
          retention-days: 30
