name: Godot prototype checks
on:
  push:
    paths: ['godot/**', '.github/workflows/godot-prototype.yml']
  pull_request:
    paths: ['godot/**', '.github/workflows/godot-prototype.yml']
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install Godot 4.3
        run: |
          wget -q https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_linux.x86_64.zip -O /tmp/godot.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v4.3-stable_linux.x86_64
      - name: Import project and check scripts
        run: /tmp/godot/Godot_v4.3-stable_linux.x86_64 --headless --path godot --editor --quit
      - name: Test counting rules
        run: /tmp/godot/Godot_v4.3-stable_linux.x86_64 --headless --path godot --script res://tests/counting_test.gd
