name: Playlumi 0.108 city, upgrade and quiz acceptance
on:
  push:
    branches: ['feature/playlumi-0.108']
  workflow_dispatch:
jobs:
  quiz-ui:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        viewport: [phone, fold]
    concurrency:
      group: playlumi-quiz-qa-${{ github.ref }}-${{ matrix.viewport }}
      cancel-in-progress: true
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build pinned 0.107 baseline with the same disposable debug key
        shell: bash
        run: |
          set -euo pipefail
          PLAYLUMI_BASELINE_SHA=d18a6279672ef8b045028be8df25109f4c777d3f
          PLAYLUMI_BASELINE_DIR="$RUNNER_TEMP/playlumi-0107-baseline"
          git worktree add --detach "$PLAYLUMI_BASELINE_DIR" "$PLAYLUMI_BASELINE_SHA"
          trap 'git worktree remove --force "$PLAYLUMI_BASELINE_DIR"' EXIT
          PLAYLUMI_BUILD_CODE=601008 gradle --no-daemon -p "$PLAYLUMI_BASELINE_DIR" assembleDebug
          mkdir -p build/upgrade-baseline
          cp "$PLAYLUMI_BASELINE_DIR/app/build/outputs/apk/debug/app-debug.apk" build/upgrade-baseline/playlumi-0107-debug.apk
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging build/upgrade-baseline/playlumi-0107-debug.apk | grep -F "versionCode='601008'"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging build/upgrade-baseline/playlumi-0107-debug.apk | grep -F "versionName='0.107'"
          printf '%s\n' "$PLAYLUMI_BASELINE_SHA" > build/upgrade-baseline/source-commit.txt
          sha256sum build/upgrade-baseline/playlumi-0107-debug.apk > build/upgrade-baseline/SHA256SUMS.txt
      - name: Build debug variant of exact 0.108 source
        env:
          PLAYLUMI_BUILD_CODE: '601009'
        run: gradle --no-daemon assembleDebug
      - name: Enable KVM when available
        run: |
          if [[ -e /dev/kvm ]]; then
            sudo chown root:kvm /dev/kvm
            sudo chmod 666 /dev/kvm
          fi
      - name: Test quiz, upgrade, city and daily controls on phone and Fold
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: default
          arch: x86_64
          profile: pixel_7
          disable-animations: true
          disable-linux-hw-accel: auto
          emulator-boot-timeout: 390
          script: |
            python3 ci/check-clean-quiz.py --viewport ${{ matrix.viewport }}
            python3 ci/check-city-progress.py --viewport ${{ matrix.viewport }} --no-install --baseline-apk build/upgrade-baseline/playlumi-0107-debug.apk
      - name: Save actual emulator screenshots and UI hierarchy
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playlumi-0108-interface-acceptance-${{ matrix.viewport }}
          path: |
            build/clean-quiz/
            build/city-progress/
            build/upgrade-baseline/*.txt
          if-no-files-found: warn
