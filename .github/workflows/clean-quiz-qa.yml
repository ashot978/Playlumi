name: Playlumi 0.123 fixed horizontal pages and upgrade acceptance
on:
  push:
    branches: ['feature/playlumi-0.123']
  workflow_dispatch:
jobs:
  quiz-ui:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        viewport: [phone, fold]
    concurrency:
      group: playlumi-quiz-qa-${{ github.ref }}-${{ matrix.viewport }}
      cancel-in-progress: true
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Offline learning, play ideas and drawing history contracts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/play-ideas-check
          javac -encoding UTF-8 -d build/play-ideas-check -sourcepath app/src/main/java tools/qa/PlayIdeasCheck.java tools/qa/FoundationsCheck.java tools/qa/DrawingHistoryCheck.java app/src/main/java/nl/playlumi/app/PlaylumiPlayIdeas.java app/src/main/java/nl/playlumi/app/PlaylumiPlayOverview.java
          timeout 90s java -cp build/play-ideas-check nl.playlumi.app.PlayIdeasCheck | tee build/play-ideas-check/report.txt
          timeout 90s java -cp build/play-ideas-check nl.playlumi.app.FoundationsCheck | tee -a build/play-ideas-check/report.txt
          timeout 90s java -cp build/play-ideas-check nl.playlumi.app.DrawingHistoryCheck | tee -a build/play-ideas-check/report.txt
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build pinned 0.122 baseline with the same disposable debug key
        shell: bash
        run: |
          set -euo pipefail
          PLAYLUMI_BASELINE_SHA=76bb79efee76c04d249da5b7154fb34320fe3278
          PLAYLUMI_BASELINE_DIR="$RUNNER_TEMP/playlumi-0122-baseline"
          git worktree add --detach "$PLAYLUMI_BASELINE_DIR" "$PLAYLUMI_BASELINE_SHA"
          trap 'git worktree remove --force "$PLAYLUMI_BASELINE_DIR"' EXIT
          PLAYLUMI_BASELINE_LOG="$RUNNER_TEMP/playlumi-0122-baseline-gradle.log"
          # Dependency hosts can briefly rate-limit concurrent clean runners.
          # Retry only transient HTTP failures; compilation failures still stop the job.
          for PLAYLUMI_BASELINE_ATTEMPT in 1 2 3; do
            if PLAYLUMI_BUILD_CODE=601023 gradle --no-daemon -p "$PLAYLUMI_BASELINE_DIR" assembleDebug 2>&1 | tee "$PLAYLUMI_BASELINE_LOG"; then
              break
            fi
            if [[ "$PLAYLUMI_BASELINE_ATTEMPT" -eq 3 ]] || ! grep -Eq 'Received status code (429|500|502|503|504)' "$PLAYLUMI_BASELINE_LOG"; then
              exit 1
            fi
            sleep "$((15 * PLAYLUMI_BASELINE_ATTEMPT))"
          done
          mkdir -p build/upgrade-baseline
          cp "$PLAYLUMI_BASELINE_DIR/app/build/outputs/apk/debug/app-debug.apk" build/upgrade-baseline/playlumi-0122-debug.apk
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging build/upgrade-baseline/playlumi-0122-debug.apk | grep -F "versionCode='601023'"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging build/upgrade-baseline/playlumi-0122-debug.apk | grep -F "versionName='0.122'"
          printf '%s\n' "$PLAYLUMI_BASELINE_SHA" > build/upgrade-baseline/source-commit.txt
          sha256sum build/upgrade-baseline/playlumi-0122-debug.apk > build/upgrade-baseline/SHA256SUMS.txt
      - name: Build debug variant of exact 0.123 source
        env:
          PLAYLUMI_BUILD_CODE: '601024'
        run: gradle --no-daemon assembleDebug
      - name: Enable KVM when available
        run: |
          if [[ -e /dev/kvm ]]; then
            sudo chown root:kvm /dev/kvm
            sudo chmod 666 /dev/kvm
          fi
      - name: Test upgrade, quiz, city, simplified navigation and drawings on phone and Fold
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: default
          arch: x86_64
          profile: pixel_7
          disable-animations: true
          disable-linux-hw-accel: auto
          emulator-boot-timeout: 390
          script: |
            python3 ci/check-clean-quiz.py --viewport ${{ matrix.viewport }} --keep-viewport
            python3 ci/check-city-progress.py --viewport ${{ matrix.viewport }} --no-install --keep-viewport --baseline-apk build/upgrade-baseline/playlumi-0122-debug.apk
      - name: Collect host diagnostics after emulator failure
        if: failure()
        shell: bash
        run: |
          mkdir -p build/city-progress
          timeout 5s sudo -n dmesg -T > build/city-progress/host-kernel.txt 2>&1 || true
          free -m > build/city-progress/host-memory.txt
      - name: Save actual emulator screenshots and UI hierarchy
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playlumi-0123-interface-acceptance-${{ matrix.viewport }}
          path: |
            build/clean-quiz/
            build/city-progress/
            build/upgrade-baseline/*.txt
            build/play-ideas-check/report.txt
          if-no-files-found: warn
