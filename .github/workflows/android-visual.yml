name: Android Playlumi 0.74 Rendered Screens
on: [push, workflow_dispatch]

jobs:
  screenshots:
    runs-on: ubuntu-latest
    timeout-minutes: 17
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Set deterministic Playlumi versionCode
        run: echo "PLAYLUMI_BUILD_CODE=600740" >> "$GITHUB_ENV"
      - name: Build illustrated Playlumi APK
        run: gradle --no-daemon assembleDebug

      - name: Enable KVM or emulator software fallback
        shell: bash
        run: |
          if [[ -e /dev/kvm ]]; then
            echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
            sudo udevadm control --reload-rules
            sudo udevadm trigger --name-match=kvm
          fi
          if [[ ! -r /dev/kvm || ! -w /dev/kvm ]]; then
            echo "ANDROID_I_WANT_MY_TCG=yes" >> "$GITHUB_ENV"
          fi

      - name: Real rendered screenshot and navigation acceptance
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: default
          arch: x86_64
          profile: pixel_7
          disable-animations: true
          disable-linux-hw-accel: auto
          emulator-boot-timeout: 390
          script: bash ci/visual-village.sh

      - name: Preserve actual nonblank game screenshots for human review
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playlumi-074-rendered-screen-previews
          path: build/visual/screenshots/
          if-no-files-found: warn
          retention-days: 30
